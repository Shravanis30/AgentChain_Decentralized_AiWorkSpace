[project]
name = "agentchain-worker"
version = "0.1.0"
description = "AgentChain Production Worker Service & Sandbox Runtime"
authors = [{ name = "AgentChain Team" }]
requires-python = ">=3.12"
dependencies = [
    "agentchain-backend",
    "agentchain-sdk",
    "docker>=7.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.8",
    "httpx>=0.27.2",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentchain_worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "../../backend"]
