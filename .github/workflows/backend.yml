name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'scripts/check_config_drift.py'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/check_config_drift.py'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    # ── Infrastructure services required by DB-dependent tests ────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentchain
          POSTGRES_PASSWORD: agentchain
          POSTGRES_DB: agentchain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pytest-cov httpx
          pip install -e backend/

      - name: Lint and format check (Ruff)
        run: ruff check backend/

      - name: Type check (Mypy)
        run: mypy --config-file backend/pyproject.toml backend/app

      # ── Safety gate: zero configuration drift allowed ─────────────────────
      - name: Configuration Drift Scanner
        run: python3 scripts/check_config_drift.py
        # Fail-fast: any cross-layer drift (chain IDs, USDC addresses,
        # reorg depth, mainnet guard) immediately fails the build.

      # ── Safety gate: Production & Mainnet Safety Verification ──────────────
      - name: Production & Mainnet Safety Verification Gate
        run: python3 scripts/verify_production_safety_gates.py


      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://agentchain:agentchain@localhost:5432/agentchain_test
          REDIS_URL: redis://localhost:6379/0
          BLOCK_MAINNET_SETTLEMENT: "true"
          ENVIRONMENT: test
        run: pytest backend/tests -v --tb=short
