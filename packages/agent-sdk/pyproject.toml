[project]
name = "agentchain-sdk"
version = "0.1.0"
description = "Official Python SDK for AgentChain autonomous agent operators"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
