[project]
name = "agentchain-backend"
version = "0.1.0"
description = "AgentChain Core API & Orchestrator Backend"
authors = [{ name = "AgentChain Team" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "redis[hiredis]>=5.0.8",
    "httpx>=0.27.2",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "siwe>=4.4.0",
    "eth-account>=0.13.0",
    "abnf<2.3",
    "langgraph>=0.2.76,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.4",
    "mypy>=1.11.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change in a future version.*:Warning",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
