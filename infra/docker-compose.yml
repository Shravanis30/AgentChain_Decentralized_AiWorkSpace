services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: agentchain-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentchain_user}:${POSTGRES_PASSWORD:-agentchain_dev_password}@postgres:5432/${POSTGRES_DB:-agentchain_db}
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    container_name: agentchain-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentchain_user}:${POSTGRES_PASSWORD:-agentchain_dev_password}@postgres:5432/${POSTGRES_DB:-agentchain_db}
      REDIS_URL: redis://redis:6379/0
      WORKER_SANDBOX_TYPE: local
      WORKER_CONCURRENCY: 2

  postgres:
    image: postgres:16-alpine
    container_name: agentchain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentchain_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentchain_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-agentchain_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentchain_user} -d ${POSTGRES_DB:-agentchain_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.2-alpine
    container_name: agentchain-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: agentchain-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: agentchain-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: agentchain-anvil
    restart: unless-stopped
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
    name: agentchain_postgres_data
  redis_data:
    name: agentchain_redis_data
  qdrant_data:
    name: agentchain_qdrant_data
  minio_data:
    name: agentchain_minio_data
